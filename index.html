<!DOCTYPE html>
<!-- FuxoraScope · Aplicación de una sola página.
     Este archivo solo declara el armazón: cabecera, contenedor de vista y
     bandeja de avisos. Todas las pantallas se generan desde src/.
     El ?v= de cada recurso se sube al publicar para que los navegadores
     no sigan sirviendo la versión anterior desde su caché. -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>FuxoraScope · Análisis de viabilidad de implantación</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1b26" />
  <meta name="description" content="Estudios de viabilidad de implantación para constructoras, inmobiliarias e inversionistas." />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/iconos/icono-192.png" />
  <link rel="apple-touch-icon" href="assets/iconos/icono-apple-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FuxoraScope" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/base.css?v=3" />
  <link rel="stylesheet" href="css/acceso.css?v=3" />
  <link rel="stylesheet" href="css/estudio.css?v=3" />
</head>
<body>

  <header id="fs-cabecera" hidden></header>

  <main id="fs-vista"></main>

  <div id="fs-avisos" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;color:#e8f3f8;background:#0d1b26">
      FuxoraScope necesita JavaScript activado para funcionar.
    </p>
  </noscript>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="src/config.js?v=3"></script>
  <script src="src/nucleo.js?v=3"></script>
  <script src="src/motor.js?v=3"></script>
  <script src="src/lectura.js?v=3"></script>
  <script src="src/datos.js?v=3"></script>
  <script src="src/informe.js?v=3"></script>
  <script src="src/acceso.js?v=3"></script>
  <script src="src/estudio.js?v=3"></script>
  <script src="src/app.js?v=3"></script>

  <script>
    // Registro del service worker: es lo que permite instalar la app en el
    // celular y abrirla sin conexión. Solo corre sobre https (o localhost),
    // que es lo que exige el navegador.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('service-worker.js').catch(function(){});
      });
    }
  </script>
</body>
</html>
